name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  smoke:
    # The build passing says nothing about whether the server actually starts
    # and lists its tools, which is the failure a user would actually hit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Server starts and lists every tool
        env:
          THRIVECART_API_KEY: ci-placeholder
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const listed = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2);
                const tools = listed?.result?.tools ?? [];
                console.log(`tools: ${tools.length}`);
                if (tools.length !== 24) {
                  console.error(`expected 24 tools, got ${tools.length}`);
                  process.exit(1);
                }
                const unannotated = tools.filter(t => t.annotations?.readOnlyHint === undefined);
                if (unannotated.length) {
                  console.error("unannotated: " + unannotated.map(t => t.name).join(", "));
                  process.exit(1);
                }
                const destructive = tools.filter(t => t.annotations.destructiveHint).map(t => t.name).sort();
                const expected = ["cancel_subscription", "refund_transaction"];
                if (JSON.stringify(destructive) !== JSON.stringify(expected)) {
                  console.error("destructive set drifted: " + destructive.join(", "));
                  process.exit(1);
                }
              });
            '

      - name: Read-only mode hides every write
        env:
          THRIVECART_API_KEY: ci-placeholder
          THRIVECART_READ_ONLY: "1"
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const listed = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2);
                const writes = listed.result.tools.filter(t => !t.annotations.readOnlyHint);
                if (writes.length) {
                  console.error("writes exposed in read-only mode: " + writes.map(t => t.name).join(", "));
                  process.exit(1);
                }
                console.log(`read-only tools: ${listed.result.tools.length}`);
              });
            '

      - name: A refund refuses without confirm
        env:
          THRIVECART_API_KEY: ci-placeholder
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"refund_transaction","arguments":{"order_id":"1"}}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const called = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2);
                const text = called?.result?.content?.[0]?.text ?? "";
                if (!called?.result?.isError || !text.includes("confirm: true")) {
                  console.error("refund was not gated:\n" + text);
                  process.exit(1);
                }
                console.log("refund correctly refused");
              });
            '

      - name: Several carts are addressable
        env:
          THRIVECART_ACCOUNTS: '[{"name":"one","api_key":"k1"},{"name":"two","api_key":"k2"}]'
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_accounts","arguments":{}}}' \
            | node dist/index.js 2>/dev/null \
            | node -e '
              let raw = "";
              process.stdin.on("data", c => raw += c);
              process.stdin.on("end", () => {
                const called = raw.trim().split("\n").map(l => JSON.parse(l)).find(m => m.id === 2);
                const data = JSON.parse(called.result.content[0].text);
                if (data.count !== 2) {
                  console.error("expected 2 accounts, got " + data.count);
                  process.exit(1);
                }
                console.log("accounts: " + data.accounts.map(a => a.name).join(", "));
              });
            '

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t thrivecart-mcp:ci .
